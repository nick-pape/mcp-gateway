# mcp.example.com — example policy
#
# Drop a real version of this at /etc/mcp-gateway/policy.yaml on the
# deploy host. Source of truth is git; the hub watches the file but a
# restart is required when adding/removing identities or MCPs.

version: 1

server:
  bind: "0.0.0.0:8443"          # docker-network interface only; not 0.0.0.0
  hitl_webhook_path: /hitl/ack

auth:
  # Authentik global issuer. With issuer_mode=global on the providers,
  # all JWTs carry iss=https://auth.example.com/. The hub validates this
  # exact match.
  issuer: https://auth.example.com/
  # JWKS endpoint for hub-side signature verification. Authentik exposes
  # this per-application, but every app under the same signing key returns
  # the same JWKS. Pinning to one is fine. Pick mcp-fanout-svc since it
  # always exists in this stack.
  jwks_uri: https://auth.example.com/application/o/mcp-fanout-svc/jwks/
  # bao uses this to bootstrap its JWT auth method. Per-app even with
  # global issuer; bao reads issuer from discovery and matches JWTs to it.
  oidc_discovery_url: https://auth.example.com/application/o/mcp-fanout-svc/
  audience_prefix: "mcp-"        # aud must start with this; suffix = identity
  algorithms: ["RS256"]
  clock_skew_s: 30
  cache_ttl_s: 600

secret_backend:
  name: bao
  config:
    addr: https://secrets.example.com
    # Refresher OUTPUT path: the file at this path is rotated by
    # mcp_hub.refresher every ~10min (see token_refresh.fanout_jwt
    # below). bao login reads it freshly each time.
    role_jwt_path: /etc/mcp-gateway/fanout_jwt
    role_template: "mcp-{mcp}-{identity}"

approver:
  name: ntfy
  config:
    server: https://notify.example.com
    topic: mcp-hitl-approvals
    publish_token_path: /run/secrets/ntfy_publish_token
    timeout_default_s: 120

audit:
  sink: stderr
  hash_args_default: true

# Token-refresher entries. Each key is an arbitrary refresher name; the
# mcp_hub.refresher subsystem writes a fresh credential to `sink.config.path`
# every `rotate_every`. Plugins (source/sink classes) are looked up via
# entry_points (group `mcp_hub.token_sources` / `mcp_hub.token_sinks`); a
# dotted-path import string also works for in-repo or unpackaged plugins.
#
# fanout_jwt below is required when secret_backend.name = bao — Authentik
# bug #16621 means access_token_validity is silently capped at 15 min, so
# the hub MUST rotate this JWT itself.
token_refresh:
  fanout_jwt:
    source:
      type: authentik_client_credentials
      config:
        token_url: https://auth.example.com/application/o/token/
        client_id: mcp-fanout-svc
        client_secret_path: /run/secrets/fanout_client_secret
        scope: "openid mcp-fanout-svc"
    sink:
      type: file
      config:
        path: /etc/mcp-gateway/fanout_jwt
        # Quote the mode — YAML 1.1 does not parse 0o400 as octal.
        mode: "0o400"
    rotate_every: minutes=10
    safety_buffer: seconds=30
    initial_backoff: seconds=5
    max_backoff: minutes=2

mcps:
  technitium:
    command: ["node", "/app/mcps/technitium/dist/index.js"]
    secret_env_name: TECHNITIUM_TOKEN_FILE
    uid_offset: 10
  paperless:
    command: ["python", "-m", "paperless_mcp"]
    secret_env_name: PAPERLESS_TOKEN_FILE
    uid_offset: 20

  # ── Drop-in HTTP MCP exemplar ──
  # Simplest possible federation: an HTTP-transport upstream with no
  # MCP-side auth, reached on the docker default network. No bao role
  # required — `auth: type: none` short-circuits the secret backend. Use
  # when the upstream MCP itself has no auth and docker network isolation
  # is sufficient (e.g. a sidecar in the same compose stack that only the
  # hub container can reach).
  #
  # Real instances: `ha` (Home Assistant MCP behind a path token at HA's
  # end) and `searxng` (OvertliDS mcp-searxng-enhanced sidecar).
  searxng:
    transport: http
    url: http://mcp-searxng-enhanced:8000/mcp
    auth:
      type: none

identities:
  ironclaw:
    aud: mcp-ironclaw
    uid_base: 1001
    allowed_tools:
      - "technitium_dns_*"
      - "technitium_dhcp_list_*"
      - "paperless_get_*"
      - "paperless_search_*"
    hitl:
      defaults: auto-approve
      overrides:
        technitium_dns_delete_record: push-approve
        technitium_dns_add_record: push-approve
    secrets:
      technitium:
        path: services/technitium/ironclaw
        field: api_token
      paperless:
        path: services/paperless/shared
        field: api_token

  paperless-bot:
    aud: mcp-paperless-bot
    uid_base: 1002
    allowed_tools:
      - "paperless_*"
    hitl:
      defaults: auto-approve
    secrets:
      paperless:
        path: services/paperless/shared
        field: api_token

  claude-code-dev:
    aud: mcp-claude-code-dev
    uid_base: 1003
    allowed_tools:
      - "technitium_*"
      - "paperless_*"
    hitl:
      defaults: auto-approve
      overrides:
        # Most-specific wins on tie; longer pattern beats shorter.
        technitium_dns_delete_record: push-approve
        "technitium_dhcp_remove_*": push-approve
    secrets:
      technitium:
        path: services/technitium/claude-code-dev
        field: api_token
      paperless:
        path: services/paperless/shared
        field: api_token

  # Human-driven (interactive) identity. Distinct from service identities
  # (which are usually auto-approve broadly). Default-gated so any
  # destructive action requires a phone tap; explicit auto-approves below
  # cover pure reads + trivial idempotent ops.
  interactive:
    aud: mcp-interactive
    uid_base: 1004
    allowed_tools:
      - "technitium_*"
      - "paperless_*"
    hitl:
      defaults: push-approve
      overrides:
        # ─── Pure reads (auto-approve, never gated) ───
        "technitium_*list*": auto-approve
        "technitium_*get*": auto-approve
        "technitium_*query*": auto-approve
        technitium_dns_health_check: auto-approve
        technitium_dns_resolve: auto-approve         # just a DNS lookup
        technitium_dns_check_update: auto-approve    # checks only, doesn't apply
        technitium_dns_dnssec_info: auto-approve
        technitium_dns_zone_options: auto-approve    # read-only inspector
        technitium_dns_export_zone: auto-approve

        # ─── Trivial cache ops (auto-approve) ───
        # Cache regenerates immediately on next query — no real loss.
        technitium_dns_delete_cached: auto-approve
        technitium_dns_flush_cache: auto-approve

        # NOT auto-approved (push-approve via defaults):
        #   - flush_allowed / flush_blocked → destroys user-curated lists
        #   - temp_disable_blocking → security gate; lets through normally-blocked traffic
        #   - add/update/delete records, zones, blocklists, allow/block entries
        #   - DHCP scope/reservation/lease create/update/delete/convert
        #   - install/uninstall apps, set_settings, set_zone_options
        #   - enable/disable zones
    secrets:
      technitium:
        path: services/technitium/claude-code-dev
        field: api_token
      paperless:
        path: services/paperless/shared
        field: api_token
