# mcp-gateway — minimal policy (NO external infrastructure)
#
# Inbound auth uses static bearer tokens (no IdP), secrets come from a local
# file (no Vault), approvals auto-approve (no ntfy), and there's no token
# refresher. Drop this at /etc/mcp-gateway/policy.yaml — the genuine
# "docker compose up and curl it" quickstart.

version: 1

server:
  bind: "0.0.0.0:8443"

# Static-token inbound auth — no IdP. Each identity gets a high-entropy bearer
# token in a SEPARATE file (keep secrets out of policy.yaml). The caller sends
# `Authorization: Bearer <token>`; the hub maps the token to the identity.
# Generate tokens with e.g.  openssl rand -hex 32
#
#   # /etc/mcp-gateway/tokens.yaml   (mode 0400, root-owned)
#   agent: "<paste a long random token here>"
#
# To use an OIDC IdP instead (Keycloak/Authentik/Auth0/Zitadel) set mode: oidc
# + issuer/jwks_uri/audience_prefix — see policy.example.yaml.
auth:
  mode: static_token
  token_file: /etc/mcp-gateway/tokens.yaml

# File-backed secrets — no external store. Pair with SOPS/age by pointing this
# at a file your deploy decrypts at boot. Format: { "<path>": { "<field>": "<value>" } }
secret_backend:
  name: file
  config:
    path: /etc/mcp-gateway/secrets.yaml

# Auto-approve everything (no human gate). Use `ntfy` (or a custom approver)
# for real HITL.
approver:
  name: auto

audit:
  sink: stderr

# One example stdio MCP. The hub spawns it per identity; its secret is read
# from the file backend at path `services/example/<identity>` field `api_token`
# and injected as the file named by EXAMPLE_TOKEN_FILE.
mcps:
  example:
    command: ["python", "-m", "example_mcp"]
    secret_env_name: EXAMPLE_TOKEN_FILE
    uid_offset: 10

identities:
  agent:
    aud: mcp-agent          # only consulted in oidc mode; required by schema
    uid_base: 1001
    allowed_tools:
      - "example_*"
    hitl:
      defaults: auto-approve
    secrets:
      example:
        path: services/example/agent
        field: api_token
