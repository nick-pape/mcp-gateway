# Local secret-scanning hook. One-time setup:
#
#   pip install pre-commit   # or: uv tool install pre-commit
#   pre-commit install
#
# Thereafter every `git commit` scans the staged diff with gitleaks (using
# .gitleaks.toml). The same scan runs in CI on the full history as a backstop
# (.github/workflows/secrets.yml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
