# mcp.pape.house — single-container MCP gateway
#
# Single source of truth. Portainer pulls this from GitHub; do NOT edit
# in the UI. Matches the ai.service.pape.house convention.
#
# ============================================================
# HOST BOOTSTRAP — required once on the LXC, do NOT skip
# ============================================================
# Before first deploy, the LXC must have:
#
#   1. /etc/mcp-pape-house/ — directory, bind-mounted read-write. Owned
#      by root, mode 0700. Contains:
#
#      - policy.yaml — copied from policy.example.yaml, then filled in
#        (Authentik issuer URL, identity audiences, secret paths,
#        token_refresh.<name>.* entries).
#
#      - fanout_jwt — refresher OUTPUT. Created by mcp_hub.refresher at
#        startup; rotated every ~10min. Do NOT pre-place this file — if
#        it exists, it will be overwritten. (The directory itself must
#        exist and be writable by root inside the container.)
#
#   2. /etc/mcp-pape-house/fanout_client_secret — Authentik OAuth2
#      client_secret for the mcp-fanout-svc provider. Mounted as a
#      docker secret. The refresher reads this file on every mint to
#      pick up rotations underneath.
#
#   3. /etc/mcp-pape-house/ntfy_publish_token — bearer token for
#      publishing to the ntfy HITL topic. Mounted as a docker secret.
#
# Mode 0400 on every secret file, owned by root. The entrypoint
# verifies they exist when the policy references their backend.
# ============================================================

name: mcp-pape-house

services:
  mcp-hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pin / override the Technitium MCP source from CI by passing
        # --build-arg on the build invocation.
        TECHNITIUM_REPO: https://github.com/nick-pape/technitium-mcp-secure.git
        TECHNITIUM_REF: main
    container_name: mcp-hub
    restart: unless-stopped

    # Bind to docker bridge only; Caddy on the LXC host fronts 8443.
    # See architecture.md § "Hub binds to docker-network only".
    ports:
      - "8443:8443"

    # Capability minimization: drop everything, add only what's
    # required to spawn stdio children as distinct UIDs via gosu.
    cap_drop:
      - ALL
    cap_add:
      - SETUID  # spawn stdio children at distinct UIDs
      - SETGID
      - CHOWN   # chown per-identity token files to the child UID so
                # only that UID (mode 0400) can read its own secret;
                # without this, files stay root-owned and gosu'd
                # children can't open them

    # Per-identity token files live on a tmpfs. Mode 0700 limits to
    # root inside the container; each token file is then chown'd to
    # its child's UID with mode 0400 by Fanout._write_secret_file.
    # Mode 0711 — root has full access; per-identity children can
    # traverse to open their own (mode 0400, owner-uid'd) token file
    # but cannot list the directory or read siblings'.
    tmpfs:
      - /run/mcp-tokens:size=16m,mode=0711

    # Bind-mount the WHOLE config directory (not just policy.yaml as a
    # single file) so the refresher can atomically write the rotated
    # fanout_jwt into it. A single-file bind mount would block the
    # rename(2) the refresher does (inode-bound to the host's file).
    # Read-write because of the refresher; the hub never modifies
    # policy.yaml itself.
    #
    # /var/run/docker.sock — bind-mounted so ContainerFanout can spawn
    # wrapper containers on the SAME docker daemon (CT 120) as the hub.
    # Means the hub container has root-equivalent on the host docker.
    # Acceptable because cap_drop:[ALL] minimizes blast radius and the
    # hub is the only thing on this LXC. Only consulted when at least
    # one MCP has transport: container in policy.yaml.
    volumes:
      - /etc/mcp-pape-house:/etc/mcp-pape-house:rw
      - /var/run/docker.sock:/var/run/docker.sock

    # ContainerFanout reaches spawned-sibling containers via the LXC
    # host's gateway. host.docker.internal is the conventional name on
    # Linux Docker since 20.10; resolved via the host-gateway sentinel.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Docker secrets land at /run/secrets/<name> automatically.
    # fanout_client_secret = Authentik OAuth2 client_secret used by the
    # token refresher to mint a fresh fanout_jwt every ~10min. Was
    # previously fanout_jwt (a static long-lived JWT); replaced because
    # Authentik silently caps validity at 15min (bug #16621).
    secrets:
      - fanout_client_secret
      - ntfy_publish_token

    # Healthcheck via /health (no auth required — see __main__.py).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8443/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

    # Useful for forensics; bounded so logs don't fill the volume.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================
  # mcp-searxng-enhanced — search + web fetch via SearXNG on CT 106
  # ============================================================
  # OvertliDS upstream (https://github.com/OvertliDS/mcp-searxng-enhanced).
  # 3 read-only tools: search_web, get_website, get_current_datetime.
  # FastMCP --http mode with stateless_http=True → the hub's stateless
  # HttpFanout speaks to it directly with no session-bridge sidecar (the
  # opposite of email-mcp, whose per-session init enforcement forced the
  # proxy).
  #
  # No MCP-side auth (matches the `ha` MCP); docker network isolation is
  # the boundary — only mcp-hub reaches it on the compose default network.
  #
  # SEARXNG_ENGINE_API_BASE_URL points at the JSON /search endpoint on
  # CT 106 (search.service.pape.house:8888) — NOT the root URL.
  #
  # Image built from upstream commit 31291d9 (the published
  # overtlids/mcp-searxng-enhanced:latest tag was a year stale and missing
  # the --http mode entirely). Digest-pinned because Zot tag mutability
  # isn't enforced.
  mcp-searxng-enhanced:
    image: registry.pape.house/local/mcp-searxng-enhanced@sha256:9272c3225deea1acd01d7bb01da66f572a9ede7c09a46fd2c1cb2550cb2151f2
    container_name: mcp-searxng-enhanced
    restart: unless-stopped
    command: ["python", "mcp_server.py", "--http"]
    environment:
      SEARXNG_ENGINE_API_BASE_URL: http://search.service.pape.house:8888/search
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8000"
      DESIRED_TIMEZONE: America/Chicago
      RATE_LIMIT_REQUESTS_PER_MINUTE: "30"
      CACHE_TTL_MINUTES: "5"
      LOG_LEVEL: INFO
    healthcheck:
      # FastMCP doesn't expose a dedicated /health; a TCP connect on :8000
      # is the lightest liveness signal. The hub's own boot eager-or-die
      # will catch any deeper MCP-protocol breakage.
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8000)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # better-email-mcp — HTTP-mode OAuth 2.1 server
  # ============================================================
  # Upstream's official image. Runs in HTTP mode (sibling container to
  # the hub) so personal Outlook accounts can complete OAuth2 device-code
  # against Microsoft — stdio mode requires app passwords, which Microsoft
  # killed for personal Outlook as of April 30, 2026.
  #
  # Hub talks to this container via the compose default network as
  # `http://email-mcp:8080/mcp`. External exposure on host :8081 (Caddy
  # block: `email.mcp.pape.house`) is for the one-time browser OAuth flow
  # at `/authorize`; after that, only hub-internal traffic matters.
  #
  # DCR_SERVER_SECRET is an HMAC seed for the dynamic-client-registration
  # path — stored in bao at `secret/services/email-mcp` field
  # `dcr_server_secret`, materialized to `/etc/mcp-pape-house/email-mcp.env`
  # on the host (mode 0400, root-owned, never in the repo).
  email-mcp:
    # Pinned to nick-pape/better-email-mcp:1.29.0-pape.2 (pape-house fork).
    # Two patches: (1) postinstall-sed extends JWT TTL 1h → 1y in compiled
    # @n24q02m/mcp-core's jwt-issuer.js; (2) src/transports/http.ts
    # accountsForThisRequest length-check fallback so disk-loaded accounts
    # survive container restart when InMemoryCredStore for a sub is empty.
    # Image is digest-pinned (Zot tag mutability isn't enforced).
    # See nick-pape/better-email-mcp/PAPE_HOUSE_PATCHES.md for full rationale.
    image: registry.pape.house/local/email-mcp@sha256:e8ae6a07be07ff691646a38dba28a2119c725461f5d939212d8ede98222e1a6c
    container_name: email-mcp
    restart: unless-stopped

    # Override the image's USER=node so the entrypoint shim can read the
    # docker secret files. Compose's `mode: 0444` directive in long-syntax
    # secret refs is silently ignored in non-swarm deployments (long-known
    # footgun), so secrets land at 0400 root and the default `node` (uid
    # 1000) user can't cat them. Cleanest fix here is to run as root in
    # the container; cap_drop: ALL would lock it down further but the
    # base image isn't shipped that way and we don't enable docker-sock
    # passthrough for this service. Single-tenant container, no privileged
    # mode, network is the only attack surface.
    user: "0:0"

    environment:
      # Explicit transport mode + bind. Without TRANSPORT_MODE the
      # default-from-bin/cli.mjs is heuristic; without PORT, the binary
      # picks an ephemeral port and listens on 127.0.0.1 only. Both bit
      # us on the first deploy (random port 43739, Caddy got 502).
      TRANSPORT_MODE: http
      PORT: "8080"
      HOST: 0.0.0.0
      PUBLIC_URL: https://email.mcp.pape.house
      # The image's USER=node makes HOME=/home/node by default. Our
      # user: "0:0" override flips it to root → HOME=/root, which would
      # land all OAuth state (~/.config/mcp/, ~/.better-email-mcp/,
      # ~/.mcp-core/) in the container's writeable layer instead of the
      # email_mcp_state volume mounted at /home/node. Pin HOME explicitly
      # so the state lands in the volume regardless of effective user.
      HOME: /home/node
      # Bundled public Azure client (Thunderbird-pattern, baked in upstream)
      # — no user-side Azure registration needed.

    # Three secrets, all daemon-resolved from /etc/mcp-pape-house/ files on
    # the host (Portainer's compose can't see absolute host paths in
    # env_file: but the daemon can resolve secrets: file: directly). mode:
    # 0444 makes them readable by the container's USER node (uid 1000) —
    # default secret mount is 0400 root which fails the entrypoint cat.
    # Source values live in bao at secret/services/email-mcp (fields
    # dcr_server_secret, credential_secret, relay_password).
    secrets:
      - source: dcr_server_secret
        target: dcr_server_secret
        mode: 0444
      - source: email_mcp_credential_secret
        target: email_mcp_credential_secret
        mode: 0444
      - source: email_mcp_relay_password
        target: email_mcp_relay_password
        mode: 0444

    entrypoint:
      - /bin/sh
      - -c
      - |
        export DCR_SERVER_SECRET="$$(cat /run/secrets/dcr_server_secret)"
        export CREDENTIAL_SECRET="$$(cat /run/secrets/email_mcp_credential_secret)"
        export MCP_RELAY_PASSWORD="$$(cat /run/secrets/email_mcp_relay_password)"
        exec node /usr/local/lib/node_modules/@n24q02m/better-email-mcp/bin/cli.mjs

    # No host port mapping — email-mcp is hub-internal now (Phase 3 wiring
    # is done; the proxy + hub federation replace the direct .mcp.json
    # path). If we ever need the relay /authorize form again (Outlook
    # re-auth after Microsoft refresh-token expiry), `pct exec 120 --
    # docker port email-mcp` + a temporary `docker run -p` lets us
    # expose 8080 ad-hoc without committing it.

    # Persistence — upstream actually writes to /home/node/.config/mcp/,
    # /home/node/.better-email-mcp/, and /home/node/.mcp-core/ (not /data
    # despite the README hint). Volume mounted at /home/node covers all
    # three. /etc/machine-id bind-mounted ro from CT 120 so the
    # encryption key (PBKDF2 of "<machineId>:node") stays stable across
    # container recreations — without this, every recreate generates a
    # fresh in-container machineId and the encrypted config can't decrypt.
    volumes:
      - email_mcp_state:/home/node
      - /etc/machine-id:/etc/machine-id:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/.well-known/oauth-authorization-server >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================================
  # email-mcp-proxy — tool-name normalization sidecar
  # ============================================================
  # Sits between mcp-hub and email-mcp. Rewrites upstream's 7 composite
  # tools into 23 granular tools so the hub's HITL policy can glob-match
  # read-vs-write at tool-name granularity (search auto-approve vs trash
  # push-approve, etc.) instead of all-or-nothing per composite.
  #
  # Internal-only — no host port mapping, no Caddy block. Only mcp-hub
  # reaches it via the compose default network (`http://email-mcp-proxy:8080/mcp`).
  # The proxy forwards the inbound Authorization header verbatim; both
  # hub→proxy and proxy→email-mcp use the same `hub_bearer` value (fetched
  # by the hub from bao via bao_backed_bearer, sent in Bearer header).
  #
  # See mcp.service.pape.house/email-mcp-proxy/README.md for the
  # tool-name rewrite design + drift-detection policy.
  email-mcp-proxy:
    # v0.2 — adds upstream session management to bridge the gap between
    # the hub's stateless HttpFanout (no Mcp-Session-Id round-trip) and
    # email-mcp's strict per-session init enforcement (via mcp-core's
    # StreamableHTTPServerTransport). Proxy now owns one persistent
    # upstream MCP session and synthesizes init responses to the hub.
    image: registry.pape.house/local/email-mcp-proxy@sha256:8b5be01f63f7bf7c0e0c4e52ecbc52fee3f0f7f33047542ee39444ce4b15e2b9
    container_name: email-mcp-proxy
    restart: unless-stopped

    environment:
      EMAIL_MCP_URL: http://email-mcp:8080
      LISTEN_PORT: "8080"
      LOG_LEVEL: INFO

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    depends_on:
      email-mcp:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # index-mcp — search surface over indexer.service.pape.house's Qdrant
  # ============================================================
  # FastMCP sidecar exposing search() over the homelab's vector index.
  # Reaches Qdrant on CT 113 directly + embeds queries via llama-swap on
  # CT 100 (same pipeline the indexer uses, so a query embedding lives in
  # the same vector space as the document chunks).
  #
  # Internal-only — no host port mapping. Only mcp-hub reaches it via the
  # compose default network at http://index-mcp:8080/mcp. Auth: none
  # (matches the `ha` + `searxng` MCPs — docker network is the boundary).
  index-mcp:
    build:
      context: ./index-mcp
      dockerfile: Dockerfile
    container_name: index-mcp
    restart: unless-stopped

    environment:
      QDRANT_URL: http://qdrant.service.pape.house:6333
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      EMBED_API_BASE: http://ai.service.pape.house:3006/v1
      # Bare model name — llama-swap doesn't strip the litellm `openai/`
      # prefix the way the cocoindex LiteLLMEmbedder does. Our direct
      # httpx /v1/embeddings call passes the model name as-is.
      EMBED_MODEL: qwen3-embed-0.6b-cpu
      DEFAULT_COLLECTION: outline
      LISTEN_PORT: "8080"

    secrets:
      - source: qdrant_api_key
        target: qdrant_api_key
        mode: 0444

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/mcp/',timeout=3); sys.exit(0 if r.status in (200,406) else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 32M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# Volumes
# ============================================================
volumes:
  # OAuth refresh tokens for each authorized email account. Persist across
  # container restarts so the device-code flow only runs once per account.
  email_mcp_state:
    name: mcp-pape-house_email_mcp_state

# ============================================================
# Secrets — file-backed, mode 0400 on the host
# ============================================================
secrets:
  fanout_client_secret:
    file: /etc/mcp-pape-house/fanout_client_secret
  ntfy_publish_token:
    file: /etc/mcp-pape-house/ntfy_publish_token
  dcr_server_secret:
    file: /etc/mcp-pape-house/email-mcp_dcr_secret
  email_mcp_credential_secret:
    file: /etc/mcp-pape-house/email-mcp_credential_secret
  email_mcp_relay_password:
    file: /etc/mcp-pape-house/email-mcp_relay_password
  # Qdrant admin API key — read by index-mcp to query collections.
  # Materialized from bao secret/services/qdrant field api_key onto disk
  # at /etc/mcp-pape-house/qdrant_api_key (manually one-time; bootstrap
  # automation is a TODO matching the email-mcp_* pattern).
  qdrant_api_key:
    file: /etc/mcp-pape-house/qdrant_api_key
