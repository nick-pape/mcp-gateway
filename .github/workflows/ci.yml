name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync (frozen lockfile, incl. dev tools)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (strict on src/)
        run: uv run mypy

      - name: Pytest
        # `linux_only` tests need gosu + root (per-identity UID separation) which
        # a stock runner lacks; integration tests self-skip. Running those in a
        # privileged job is a follow-up.
        run: uv run pytest -m "not linux_only"
