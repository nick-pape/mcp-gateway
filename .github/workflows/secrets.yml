name: secrets

# Secret scanning as a merge gate. Complements (does not replace) GitHub's
# native secret scanning + push protection — native is pattern-catalog based
# and free only on public repos; this runs now (while private), is history
# aware, and carries a custom rule for opaque URL-path tokens (see
# .gitleaks.toml and issue #5).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history → the scan is history-aware

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history + tracked tree
        # git mode → scans every commit on the branch (no .venv, no
        # untracked files); non-zero exit on any finding fails the job.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
