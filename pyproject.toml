[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Multi-tenant MCP gateway: pluggable secrets/auth/approvals, per-identity isolation, HITL approvals, and audit."
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Nick Pape" }]
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "gateway", "oidc", "hitl", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

# Production deps. Pin tightly; bump deliberately.
dependencies = [
    # FastMCP — Streamable HTTP server. Pin exactly; bump deliberately.
    # (Streamable HTTP transport stability has wobbled in 2.x; do not float.)
    "fastmcp>=2.10,<3",

    # JWT validation. >=2.10.1 for CVE-2024-53861 (issuer claim type confusion).
    # python-jose explicitly rejected (CVE history + thin maintenance).
    "pyjwt[crypto]>=2.10.1,<3",

    # Async HTTP client for Authentik JWKS, ntfy publish, bao API.
    "httpx>=0.28,<1",

    # Config schema + validation.
    "pydantic>=2.9,<3",

    # Policy YAML loading.
    "pyyaml>=6.0,<7",

    # Globally-unique IDs for audit request_id (lexicographically sortable).
    "python-ulid>=3,<4",

    # Docker SDK — used by ContainerFanout to spawn wrapper containers on a
    # configured Docker host. docker-py is sync; we wrap calls via
    # asyncio.to_thread (see src/mcp_fanout/container_fanout.py).
    "docker>=7,<8",
]

[project.urls]
Homepage = "https://github.com/nick-pape/mcp-gateway"
Repository = "https://github.com/nick-pape/mcp-gateway"
Issues = "https://github.com/nick-pape/mcp-gateway/issues"

[project.scripts]
mcp-hub = "mcp_hub.__main__:main"

# -----------------------------------------------------------------------------
# Token-refresher plugins
# -----------------------------------------------------------------------------
# The hub looks up TokenSource/TokenSink classes via these entry points.
# Third-party plugins declare their own under the same group names in their
# own pyproject.toml — install side-by-side with the hub and they're picked
# up automatically. See src/mcp_hub/refresher/registry.py for resolution
# order (entry points first, then dotted-path fallback).

[project.entry-points."mcp_hub.token_sources"]
authentik_client_credentials = "mcp_hub.refresher.builtins.authentik:AuthentikClientCredentialsSource"

[project.entry-points."mcp_hub.token_sinks"]
file = "mcp_hub.refresher.builtins.file_sink:FileSink"

# Secret-backend adapters. Built-ins below; third-party adapters declare the
# same group in their own pyproject.toml and are picked up once installed.
# See src/mcp_hub/secrets/registry.py.
[project.entry-points."mcp_hub.secret_backends"]
env = "mcp_hub.secrets.env:EnvSecretBackend"
file = "mcp_hub.secrets.file:FileSecretBackend"
bao = "mcp_hub.secrets.bao:BaoSecretBackend"

# Approver (HITL) adapters. Built-ins below; third-party adapters (Slack,
# Telegram, webhook, ...) declare the same group in their own pyproject.toml.
# See src/mcp_hub/approvers/registry.py.
[project.entry-points."mcp_hub.approvers"]
auto = "mcp_hub.approvers.auto:AutoApprover"
reject = "mcp_hub.approvers.reject:RejectApprover"
ntfy = "mcp_hub.approvers.ntfy:NtfyApprover"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    # types-* for stdlib stubs the deps don't ship.
    "types-pyyaml>=6.0,<7",
]

# uv builds both packages from src/ in a single project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fanout", "src/mcp_hub"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Enable a meaningful default set; expand later as patterns emerge.
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "S",            # bandit (security)
    "ASYNC",        # async-correctness
    "RUF",          # ruff-specific
    "SLF",          # private-member access (flagged in src/, ignored in tests)
]
ignore = [
    "S101",         # asserts in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S",         # tests legitimately do things bandit dislikes
    "B",         # tests legitimately raise things flake8-bugbear flags
    "ASYNC240",  # sync pathlib in async tests is fine; not a real perf issue
    "SLF001",    # tests reach into private state for assertions
    "E501",      # long lines in tests (fixtures, assertions) are acceptable
    "RUF043",    # regex in pytest.raises(match=...) is fine unescaped
]
# scripts/ are operational helpers; scope out a security lint that doesn't fit.
"scripts/**" = ["S105"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
# Allow tests slightly looser typing:
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false  # json.loads returns Any; fighting that in tests is noise

# Third-party libs without bundled stubs.
[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "linux_only: tests that require Linux capabilities (UID separation, /proc semantics)",
    "integration: integration tests (slower, may spawn subprocesses)",
]
