[project]
name = "mcp-pape-house"
version = "0.0.0"
description = "Homelab MCP gateway: single container, in-process Fanout, Authentik OIDC, ntfy HITL, bao-injected per-identity secrets"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Nick Pape" }]

# Production deps. Pin tightly; bump deliberately.
dependencies = [
    # FastMCP — Streamable HTTP server. Pin exactly; bump deliberately.
    # (Streamable HTTP transport stability has wobbled in 2.x; do not float.)
    "fastmcp>=2.10,<3",

    # JWT validation. >=2.10.1 for CVE-2024-53861 (issuer claim type confusion).
    # python-jose explicitly rejected (CVE history + thin maintenance).
    "pyjwt[crypto]>=2.10.1,<3",

    # Async HTTP client for Authentik JWKS, ntfy publish, bao API.
    "httpx>=0.28,<1",

    # Config schema + validation.
    "pydantic>=2.9,<3",

    # Policy YAML loading.
    "pyyaml>=6.0,<7",

    # Globally-unique IDs for audit request_id (lexicographically sortable).
    "python-ulid>=3,<4",
]

[project.scripts]
mcp-hub = "mcp_hub.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    # types-* for stdlib stubs the deps don't ship.
    "types-pyyaml>=6.0,<7",
]

# uv builds both packages from src/ in a single project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fanout", "src/mcp_hub"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Enable a meaningful default set; expand later as patterns emerge.
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "S",            # bandit (security)
    "ASYNC",        # async-correctness
    "RUF",          # ruff-specific
]
ignore = [
    "S101",         # asserts in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]   # tests legitimately do things bandit dislikes

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
# Allow tests slightly looser typing:
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false  # json.loads returns Any; fighting that in tests is noise

# Third-party libs without bundled stubs.
[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "linux_only: tests that require Linux capabilities (UID separation, /proc semantics)",
    "integration: integration tests (slower, may spawn subprocesses)",
]
